[project]
name = "nba-player-similarity"
version = "0.1.0"
description = "Historical NBA player similarity experiments."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.2",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "nba_player_similarity"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
]
