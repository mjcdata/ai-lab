name: AI Lab Codex automation

on:
  workflow_dispatch:
  # Enable after the manual end-to-end PR test:
  # schedule:
  #   - cron: '17 * * * *'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ai-lab-codex
  cancel-in-progress: false

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check for an existing Codex PR
        id: guard
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const prs = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', per_page: 100
            });
            const pending = prs.some(pr => pr.head.ref.startsWith('codex/ai-lab-'));
            core.setOutput('proceed', pending ? 'false' : 'true');
            if (pending) core.info('An AI Lab Codex PR is awaiting review. Skipping.');

      - name: Checkout repository
        if: steps.guard.outputs.proceed == 'true'
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Check for eligible work before API call
        if: steps.guard.outputs.proceed == 'true'
        id: eligible
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import os, re
          # Only explicitly approved implementation tasks are eligible.
          # Example: - [ ] **2.1** [CODEX-READY] Implement the parser.
          candidates = [Path('WORK_PLAN.md')]
          candidates += sorted(Path('.').glob('**/WORKPLAN.md'))
          actionable = any(
              re.search(r'^\s*- \[ \].*\[CODEX-READY\]', line, re.I)
              and not re.search(r'DECISION GATE|approval required', line, re.I)
              for p in candidates if '.github' not in p.parts
              for line in p.read_text().splitlines()
          )
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f"run={'true' if actionable else 'false'}\n")
          print('Eligible unchecked task found' if actionable else 'No unchecked non-gate task; skip Codex')
          PY

      - name: Run Codex on one approved AI Lab task
        if: steps.guard.outputs.proceed == 'true' && steps.eligible.outputs.run == 'true'
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ':workspace'
          prompt: |
            Read AGENTS.md, WORK_PLAN.md, relevant project WORKPLAN.md files,
            and recent commits. Follow the active project and priorities in WORK_PLAN.md.
            Select and implement at most ONE unchecked task explicitly tagged\n            [CODEX-READY] in the active project's work plan. If none exists,\n            make no changes. A tag is required even if other tasks are unchecked.\n            Do not skip ahead past unmet dependencies or decision gates.\n            Research, source evaluation, comparisons, recommendations, and\n            data acquisition are handled by the user with ChatGPT, not Codex.\n            Never perform research tasks or edit a work plan merely to log\n            blocked research. Only implement approved code, tests, or technical\n            documentation directly supporting that implementation.
            If the next task is an approval gate or requires a consequential decision,
            do not bypass it; make no changes and explain what approval is needed.
            Never bulk-download datasets, run expensive training, incur additional
            service costs, deploy, or change scope without explicit documented approval.
            Keep edits focused on the selected task and its work-plan progress.
            Do not modify .github/, AGENTS.md, or approval rules.
            Validate changes with available tests/checks. Mark a task complete only
            with evidence. If external access is blocked, report it without inventing
            research results. Never push, merge, or create a PR yourself.

      - name: Create draft PR if files changed
        if: steps.guard.outputs.proceed == 'true' && steps.eligible.outputs.run == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: codex/ai-lab-hourly
          delete-branch: true
          title: 'AI Lab: Codex proposed task'
          body: |
            Automated Codex proposal for one approved AI Lab task.
            Review code, validation evidence, and approval gates before merging.
            This workflow does not merge PRs.
          draft: true
          # No add-paths restriction: git stages only files actually changed by Codex.
          # The Codex prompt prohibits editing workflow and approval files.
