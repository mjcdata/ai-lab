name: AI Lab Codex automation

on:
  workflow_dispatch:
  # Enable after a manual end-to-end direct-push test:
  # schedule:
  #   - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: ai-lab-codex
  cancel-in-progress: false

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Check for eligible work before API call
        id: eligible
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import os, re
          # Only explicitly approved implementation tasks are eligible.
          # Example: - [ ] **2.1** [CODEX-READY] Implement the parser.
          candidates = [Path('WORK_PLAN.md')]
          candidates += sorted(Path('.').glob('**/WORKPLAN.md'))
          actionable = any(
              re.search(r'^\s*- \[ \].*\[CODEX-READY\]', line, re.I)
              and not re.search(r'DECISION GATE|approval required', line, re.I)
              for p in candidates if '.github' not in p.parts
              for line in p.read_text().splitlines()
          )
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f"run={'true' if actionable else 'false'}\n")
          print('Eligible unchecked task found' if actionable else 'No unchecked non-gate task; skip Codex')
          PY

      - name: Run Codex on one approved AI Lab task
        if: steps.eligible.outputs.run == 'true'
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ':workspace'
          prompt: |
            Read AGENTS.md, WORK_PLAN.md, relevant project WORKPLAN.md files,
            and recent commits. Follow the active project and priorities in WORK_PLAN.md.
            Select and implement at most ONE unchecked task explicitly tagged [CODEX-READY] in the active project's work plan. If none exists,
            make no changes. A tag is required even if other tasks are unchecked.
            Do not skip ahead past unmet dependencies or decision gates.
            Research, source evaluation, comparisons, recommendations, and
            data acquisition are handled by the user with ChatGPT, not Codex.
            Never perform research tasks or edit a work plan merely to log
            blocked research. Only implement approved code, tests, or technical
            documentation directly supporting that implementation.
            If the next task is an approval gate or requires a consequential decision,
            do not bypass it; make no changes and explain what approval is needed.
            Never bulk-download datasets, run expensive training, incur additional
            service costs, deploy, or change scope without explicit documented approval.
            Keep edits focused on the selected task and its work-plan progress.
            Do not modify .github/, AGENTS.md, or approval rules.
            Validate changes with available tests/checks. Mark a task complete only
            with evidence. If external access is blocked, report it without inventing
            research results. Do not create PRs or branches. The workflow validates and pushes approved changes to main.

      - name: Validate and commit approved changes to main
        if: steps.eligible.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "No changes from Codex"
            exit 0
          fi
          # Automation may not modify its own approval or workflow rules.
          if git status --porcelain | grep -E '(^|[[:space:]])(AGENTS\.md|\.github/)' ; then
            echo "Protected workflow/instructions changed; refusing push"
            exit 1
          fi
          if [[ -f machine-learning/nba/pyproject.toml ]]; then
            cd machine-learning/nba
            uv run python -m unittest discover -s tests -v
            cd ../..
          fi
          git fetch origin main
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]]; then
            echo "main advanced while Codex ran; refusing non-fast-forward push"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(ai-lab): implement approved Codex task"
          git push origin HEAD:main
